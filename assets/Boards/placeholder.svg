<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c17"/>
      <stop offset="100%" stop-color="#0a0e0b"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#006634"/>
      <stop offset="100%" stop-color="#004724"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle architectural grid lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="500"/>
    <line x1="150" y1="0" x2="150" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="350" y1="0" x2="350" y2="500"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="300" x2="400" y2="300"/>
    <line x1="0" y1="400" x2="400" y2="400"/>
  </g>

  <!-- Silhouette / Avatar -->
  <circle cx="200" cy="190" r="70" fill="url(#avatarGrad)"/>
  <path d="M110 390 C110 300, 290 300, 290 390 Z" fill="url(#avatarGrad)"/>
  
  <!-- Monogram / Initials -->
  <text x="200" y="202" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" text-anchor="middle" letter-spacing="2">ABJ</text>

  <!-- Label -->
  <text x="200" y="440" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" text-anchor="middle" letter-spacing="1.5">LEAD PROJECT ADMINISTRATOR</text>
</svg>